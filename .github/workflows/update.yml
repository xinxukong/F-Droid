name: Update F-Droid Repo

on:
  schedule:
    - cron: '0 3 * * *'   # 每天 UTC 3 点自动运行
  workflow_dispatch:       # 允许手动点击运行

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install fdroidserver
        run: pip install fdroidserver

      - name: Prepare directories
        run: |
          mkdir -p fdroid/repo
          mkdir -p fdroid/archive

      - name: Restore keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > fdroid/keystore.p12

      - name: Update repo index
        run: |
          cd fdroid
          # 自动生成完美的 config.yml 文件
          cat <<EOF > config.yml
          repo_url: https://xinxukong.github.io/F-Droid/fdroid/repo
          repo_name: XinxuKong F-Droid
          repo_description: 个人 F-Droid 仓库，自动同步 Kazumi 等应用。
          archive_older: 0
          keystore: keystore.p12
          repo_keyalias: xinxukong
          keydname: CN=xinxukong, OU=fdroid, O=xinxukong, L=Unknown, ST=Unknown, C=CN
          keystorepass: ${{ secrets.KEYPASS }}
          keypass: ${{ secrets.KEYPASS }}
          EOF
          # 运行 F-Droid 更新
          fdroid update

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add fdroid/repo fdroid/metadata fdroid/archive
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update F-Droid repo"
          git push
